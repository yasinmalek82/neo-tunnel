# In frontend backhaul, add this line above both permanent route rules:
# use_backend naive if { str(preference),map(/etc/neo-tunnel/runtime/route.map,primary) -m str naive } { nbsrv(naive) gt 0 }

backend naive
    option tcp-check
    tcp-check connect
    tcp-check send GET\ /healthz\ HTTP/1.0\r\n\r\n
    tcp-check expect string "HTTP/1.0 200 OK"
    tcp-check connect port 17122
    tcp-check send GET\ /readyz\ HTTP/1.0\r\n\r\n
    tcp-check expect string "HTTP/1.0 200 OK"
    tcp-check expect string backhaul-ready-v1
    server via_naive 127.0.0.1:17121 check
