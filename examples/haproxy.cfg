global
    log stdout format raw local0 notice
    maxconn 2048
    stats socket /run/neo-tunnel/haproxy.sock mode 0660 level admin

defaults
    mode tcp
    log global
    timeout connect 2s
    timeout client 5m
    timeout server 5m
    timeout check 1500ms
    default-server inter 5s fall 3 rise 3 init-state fully-down

frontend backhaul
    bind 127.0.0.1:16443
    use_backend primary if { str(preference),map(/etc/neo-tunnel/runtime/route.map,primary) -m str primary } { nbsrv(primary) gt 0 }
    use_backend standby if { str(preference),map(/etc/neo-tunnel/runtime/route.map,primary) -m str standby } { nbsrv(standby) gt 0 }
    use_backend primary if { nbsrv(primary) gt 0 }
    default_backend standby

backend primary
    option tcp-check
    # Require the app's forwarded listener and an actual canary response through the same frpc.
    tcp-check connect
    tcp-check send GET\ /healthz\ HTTP/1.0\r\n\r\n
    tcp-check expect string "HTTP/1.0 200 OK"
    tcp-check connect port 17102
    tcp-check send GET\ /readyz\ HTTP/1.0\r\n\r\n
    tcp-check expect string "HTTP/1.0 200 OK"
    tcp-check expect string backhaul-ready-v1
    server via_primary 127.0.0.1:17101 check

backend standby
    option tcp-check
    tcp-check connect
    tcp-check send GET\ /healthz\ HTTP/1.0\r\n\r\n
    tcp-check expect string "HTTP/1.0 200 OK"
    tcp-check connect port 17112
    tcp-check send GET\ /readyz\ HTTP/1.0\r\n\r\n
    tcp-check expect string "HTTP/1.0 200 OK"
    tcp-check expect string backhaul-ready-v1
    server via_standby 127.0.0.1:17111 check inter 15s
